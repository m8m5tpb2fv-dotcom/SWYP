services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swyp
      POSTGRES_PASSWORD: swyp
      POSTGRES_DB: swyp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swyp
      MINIO_ROOT_PASSWORD: swyp-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 swyp swyp-secret; do sleep 1; done;
      mc mb -p local/swyp-videos;
      mc anonymous set download local/swyp-videos;
      "

volumes:
  postgres_data:
  minio_data:
