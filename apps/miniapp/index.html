<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 + user-scalable=no: without this, focusing any text
      input whose font-size is under 16px makes iOS auto-zoom the whole page
      in (the classic "everything gets bigger while typing" bug) — this pins
      the layout so it never scales, regardless of what's focused.

      interactive-widget=overlays-content: without this, the on-screen
      keyboard opening (e.g. tapping the comment box) shrinks the layout
      viewport — html/body/#root are height:100% (index.css) — which
      shrinks Feed's full-height snap-scroll container too. Since each video
      is itself h-full, that resize throws off scrollTop's alignment with
      the new (shorter) item height, and CSS scroll-snap "corrects" by
      settling on the nearest snap point — sometimes the next video. This
      keeps the layout viewport fixed and lets the keyboard overlay it
      instead, so nothing about Feed's size changes when it opens.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <title>Shorts</title>
    <!--
      Video/thumbnail bytes are served directly from this Railway bucket
      (Tigris), not proxied through our API — warming the connection (DNS +
      TCP + TLS) while /api/feed is still in flight overlaps that handshake
      with the JSON round-trip instead of paying for it serially after the
      first video URL comes back. Measured ~350ms TLS + ~590ms TTFB cold.
      Safe if the bucket host ever changes: just becomes an unused hint.
    -->
    <link rel="preconnect" href="https://videos-fn-nfujwaqq6ohkxrs.t3.storageapi.dev" />
    <link rel="dns-prefetch" href="https://videos-fn-nfujwaqq6ohkxrs.t3.storageapi.dev" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
